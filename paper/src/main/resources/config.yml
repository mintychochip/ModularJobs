# Database is configured in database.yml (MySQL only).

# Payment eligibility (honored by JobPaymentListener via PaymentSettings)
pay-in-creative: true
pay-while-riding: false
# World names (case-insensitive) where job actions never pay
disabled-worlds: []
# Fraction of total damage a contributor must deal to receive kill pay (0..1)
kill-contribution-cutoff: 0.5
# Max distance (blocks) from furnace for smelt/bake pay attribution
furnace-max-distance: 25.0

# Economy deposits. Mint is optional; without it, positive currency rewards use the configured
# missing-provider policy. Use fail when a real currency provider is mandatory.
economy:
  required: false
  missing-provider: blackhole # blackhole | fail
# Auxiliary profession services. The core ProfessionService is always registered for
# dependent plugins; this flag exposes the optional Recipe/Buff/Station/NodeHarvest services.
profession-apis:
  register-bukkit-services: false
# Optional external interaction gates can enforce world-level requirements. ModularJobs
# continues to own profession progression, task data, and payment.

trackable_entities:

# Color scheme for all command outputs
# Supports hex colors (e.g., #FFD700)
colors:
  primary: "#FFD700"      # Main highlights (titles, keys)
  secondary: "#FFFF00"    # Secondary highlights (values)
  accent: "#00FFFF"       # Accent colors (types)
  tertiary: "#FF00FF"     # Tertiary colors (special info)
  neutral: "#808080"      # Neutral/gray text (labels, borders)
  error: "#FF0000"        # Error messages

# Player preferences for info displays
preferences:
  # Default number of entries to show per page in chat output
  # Players can override this with /jobs info preference entries <number>
  entries-per-page: 10
  # Default view mode: true = GUI dialog, false = chat output
  # Players can override with /jobs info preference gui/chat
  default-gui-mode: true

# Secure web editor. Disabled until an operator configures external services.
# MySQL and the REST API remain external; the plugin never provisions either.
editor:
  enabled: false
  session-api-url: ""
  web-editor-url: ""
  # Must match REST SESSION_CREATE_SECRET when the API requires one.
  session-create-secret: ""
  session-ttl-minutes: 1440
