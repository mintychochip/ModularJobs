name: Publish GitHub Packages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Credential-free checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modularjobs
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODULARJOBS_TEST_MYSQL_URL: jdbc:mysql://localhost:13306/modularjobs
      MODULARJOBS_TEST_MYSQL_USER: test
      MODULARJOBS_TEST_MYSQL_PASSWORD: test
      DATABASE_URL: mysql://test:test@127.0.0.1:13306/modularjobs
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute release version
        run: echo "VERSION=$(date -u +'%y.%-m.%-d').${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Checkout craftux dependency (pinned release)
        uses: actions/checkout@v4
        with:
          repository: aincraft-org/craftux
          ref: 402bea8ce21847df632a10b00b563665db205de
          path: craftux
          fetch-depth: 1
      - name: Link craftux local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/craftux" "$GITHUB_WORKSPACE/../craftux"
      - name: Set up Rust for craftux views
        uses: dtolnay/rust-toolchain@stable
      - name: Publish craftux local Maven artifacts
        working-directory: craftux
        run: |
          chmod +x gradlew
          ./gradlew \
            :api:publishMavenPublicationToLocalBuildRepository \
            :common:publishMavenPublicationToLocalBuildRepository \
            :paper:publishMavenPublicationToLocalBuildRepository \
            --console=plain --no-daemon
      - name: Verify required local dependency artifacts
        run: test -f ../craftux/build/maven-repo/dev/craftux/craftux-paper/1.0.2/craftux-paper-1.0.2.pom
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Apply MySQL schema
        run: |
          ./scripts/apply-mysql-schema.sh \
            "mysql://test:test@127.0.0.1:13306/modularjobs"
      - name: Java checks
        run: ./gradlew -PreleaseVersion="$VERSION" check -Dmaven.repo.local=${{ runner.temp }}/m2 --console=plain --no-daemon
      - name: Validate release POMs
        run: |
          ./gradlew -PreleaseVersion="$VERSION" \
            :api:generatePomFileForMavenPublication \
            :common:generatePomFileForMavenPublication \
            --console=plain --no-daemon
          grep -q "<version>$VERSION</version>" api/build/publications/maven/pom-default.xml
          grep -q "<version>$VERSION</version>" common/build/publications/maven/pom-default.xml
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/rest-api -> target
      - name: rest-api checks
        working-directory: web/rest-api
        run: cargo test --all-targets
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/session-editor/package-lock.json
      - name: Install session-editor dependencies
        working-directory: web/session-editor
        run: npm ci
      - name: Test session-editor
        working-directory: web/session-editor
        run: npm test
      - name: Build session-editor
        working-directory: web/session-editor
        run: npm run build

  publish:
    name: Publish API and common to GitHub Packages
    needs: check
    if: needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reject workflow reruns
        if: github.run_attempt != 1
        run: |
          echo 'This package run was retried. Start a new workflow-dispatch run instead of reusing an immutable version.'
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute release version
        run: echo "VERSION=$(date -u +'%y.%-m.%-d').${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Publish Maven packages
        run: |
          ./gradlew \
            -PreleaseVersion="$VERSION" \
            :api:publishMavenPublicationToGitHubPackagesRepository \
            :common:publishMavenPublicationToGitHubPackagesRepository \
            --console=plain --no-daemon
