name: Publish GitHub Packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Credential-free checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modularjobs
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODULARJOBS_TEST_MYSQL_URL: jdbc:mysql://localhost:13306/modularjobs
      MODULARJOBS_TEST_MYSQL_USER: test
      MODULARJOBS_TEST_MYSQL_PASSWORD: test
      DATABASE_URL: mysql://test:test@127.0.0.1:13306/modularjobs
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Resolve release version
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties --console=plain | sed -n 's/^version: //p')"
          ./scripts/validate-release-version.sh "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::Gradle version $VERSION does not match tag $TAG_VERSION"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Checkout craftux dependency (pinned release)
        uses: actions/checkout@v4
        with:
          repository: aincraft-org/craftux
          ref: 402bea8ce21847df632a10b00b563665db205de9
          path: craftux
          fetch-depth: 1
      - name: Link craftux local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/craftux" "$GITHUB_WORKSPACE/../craftux"
      - name: Set up Rust for craftux views
        uses: dtolnay/rust-toolchain@stable
      - name: Publish craftux local Maven artifacts
        working-directory: craftux
        run: |
          chmod +x gradlew
          ./gradlew \
            :api:publishMavenPublicationToLocalBuildRepository \
            :common:publishMavenPublicationToLocalBuildRepository \
            :paper:publishMavenPublicationToLocalBuildRepository \
            --console=plain --no-daemon
      - name: Require Mint read-only deploy key
        env:
          MINT_DEPLOY_KEY: ${{ secrets.MINT_DEPLOY_KEY }}
        run: |
          if [[ -z "$MINT_DEPLOY_KEY" ]]; then
            echo "::error::ModularJobs needs the repository-scoped read-only MINT_DEPLOY_KEY for aincraft-org/mint."
            exit 1
          fi
      - name: Checkout mint dependency (private, pinned source)
        uses: actions/checkout@v4
        with:
          repository: aincraft-org/mint
          ref: 873fd3e359d3f3ac5b22fc84bc9aaae2a6adabdd
          path: mint
          fetch-depth: 1
          ssh-key: ${{ secrets.MINT_DEPLOY_KEY }}
          persist-credentials: false
      - name: Link mint local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/mint" "$GITHUB_WORKSPACE/../mint"
      - name: Publish mint API to local Maven repository
        working-directory: mint
        run: |
          chmod +x gradlew
          ./gradlew \
            :api:publishMavenPublicationToLocalBuildRepository \
            --console=plain --no-daemon
      - name: Checkout Preferences API dependency
        uses: actions/checkout@v4
        with:
          repository: mintychochip/Preferences
          ref: c78eac8c81104ba0890fc98d5f49090d90d0dee7
          path: preferences
          fetch-depth: 1
      - name: Publish Preferences API to isolated Maven local
        working-directory: preferences
        run: |
          chmod +x gradlew
          ./gradlew :api:publishToMavenLocal \
            -Dmaven.repo.local=${{ runner.temp }}/m2 \
            --console=plain --no-daemon
      - name: Verify required local dependency artifacts
        run: |
          test -f ../craftux/build/maven-repo/dev/craftux/craftux-paper/1.0.2/craftux-paper-1.0.2.pom
      - name: Apply MySQL schema
        run: |
          ./scripts/apply-mysql-schema.sh \
            "mysql://test:test@127.0.0.1:13306/modularjobs"
      - name: Java checks
        run: ./gradlew check -Dmaven.repo.local=${{ runner.temp }}/m2 --console=plain --no-daemon
      - name: Validate release POMs
        run: |
          ./gradlew \
            :api:generatePomFileForMavenPublication \
            --console=plain --no-daemon
          grep -q "<version>$VERSION</version>" api/build/publications/maven/pom-default.xml
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/rest-api -> target
      - name: rest-api checks
        working-directory: web/rest-api
        run: cargo test --all-targets
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/session-editor/package-lock.json
      - name: Install session-editor dependencies
        working-directory: web/session-editor
        run: npm ci
      - name: Test session-editor
        working-directory: web/session-editor
        run: npm test
      - name: Build session-editor
        working-directory: web/session-editor
        run: npm run build

  publish:
    name: Publish API to GitHub Packages
    needs: check
    if: needs.check.result == 'success' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reject workflow reruns
        if: github.run_attempt != 1
        run: |
          echo 'This package run was retried. Start a new workflow-dispatch run instead of reusing an immutable version.'
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Resolve release version
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties --console=plain | sed -n 's/^version: //p')"
          ./scripts/validate-release-version.sh "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::Gradle version $VERSION does not match tag $TAG_VERSION"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Publish Maven package
        run: |
          ./gradlew \
            :api:publishMavenPublicationToGitHubPackagesRepository \
            --console=plain --no-daemon
