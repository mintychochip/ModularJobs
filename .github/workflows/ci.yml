name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  java:
    name: Java (Error Prone + tests + quality + shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: modularjobs
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d modularjobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Live PG for repository / schema tests (skipped when unreachable)
      MODULARJOBS_TEST_PG_URL: jdbc:postgresql://localhost:55432/modularjobs
      MODULARJOBS_TEST_PG_USER: test
      MODULARJOBS_TEST_PG_PASSWORD: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply Postgres schema (for PG-backed unit tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          ./scripts/apply-postgres-schema.sh \
            "postgres://test:test@127.0.0.1:55432/modularjobs"

      - name: Check (compile + Error Prone + unit tests + static analysis)
        # quality.fail not set → Checkstyle/PMD/SpotBugs report-only
        run: ./gradlew check --console=plain --no-daemon

      - name: Shadow jar
        run: ./gradlew :paper:shadowJar --console=plain --no-daemon

      - name: Upload paper shadow jar
        uses: actions/upload-artifact@v4
        with:
          name: paper-all
          path: paper/build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/pmd/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
          if-no-files-found: ignore

  rest-api:
    name: rest-api (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/rest-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: modularjobs
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d modularjobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:55432/modularjobs
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/rest-api -> target

      - name: cargo test
        run: cargo test --all-targets

  session-editor:
    name: session-editor (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/session-editor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/session-editor/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
