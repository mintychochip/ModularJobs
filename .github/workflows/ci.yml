name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :jobs-api:test :jobs-core:test --console=plain

      - name: Shadow jar
        run: ./gradlew :jobs-core:shadowJar --console=plain

      - name: Upload shadow jar
        uses: actions/upload-artifact@v4
        with:
          name: jobs-core-all
          path: jobs-core/build/libs/jobs-core-all.jar
