name: CI

on:
  push:
    branches: [master, main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  java:
    name: Java (Error Prone + tests + quality + shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: modularjobs
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d modularjobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Live PG for repository / schema tests (skipped when unreachable)
      MODULARJOBS_TEST_PG_URL: jdbc:postgresql://localhost:55432/modularjobs
      MODULARJOBS_TEST_PG_USER: test
      MODULARJOBS_TEST_PG_PASSWORD: test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Checkout craftux dependency (pinned release)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aincraft-org/craftux
          ref: 402bea8ce21847df632a10b00b563665db205de9
          path: craftux
          fetch-depth: 1

      - name: Link craftux local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/craftux" "$GITHUB_WORKSPACE/../craftux"

      - name: Set up Rust for craftux views
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Publish craftux local Maven artifacts
        working-directory: craftux
        run: |
          chmod +x gradlew
          ./gradlew \
            :api:publishMavenPublicationToLocalBuildRepository \
            :common:publishMavenPublicationToLocalBuildRepository \
            :paper:publishMavenPublicationToLocalBuildRepository \
            --console=plain --no-daemon
      - name: Require Mint read-only deploy key
        env:
          MINT_DEPLOY_KEY: ${{ secrets.MINT_DEPLOY_KEY }}
        run: |
          if [[ -z "$MINT_DEPLOY_KEY" ]]; then
            echo "::error::ModularJobs needs the repository-scoped read-only MINT_DEPLOY_KEY for aincraft-org/mint."
            exit 1
          fi

      - name: Checkout mint dependency (private, pinned source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aincraft-org/mint
          ref: 873fd3e359d3f3ac5b22fc84bc9aaae2a6adabdd
          path: mint
          fetch-depth: 1
          ssh-key: ${{ secrets.MINT_DEPLOY_KEY }}
          persist-credentials: false

      - name: Link mint local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/mint" "$GITHUB_WORKSPACE/../mint"

      - name: Publish mint API to local Maven repository
        working-directory: mint
        run: |
          chmod +x gradlew
          ./gradlew \
            :api:publishMavenPublicationToLocalBuildRepository \
            --console=plain --no-daemon

      - name: Checkout Preferences API dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mintychochip/Preferences
          ref: c78eac8c81104ba0890fc98d5f49090d90d0dee7
          path: preferences
          fetch-depth: 1

      - name: Publish Preferences API to isolated Maven local
        working-directory: preferences
        run: |
          chmod +x gradlew
          ./gradlew :api:publishToMavenLocal \
            -Dmaven.repo.local=${{ runner.temp }}/m2 \
            --console=plain --no-daemon

      - name: Verify required local dependency artifacts
        run: |
          test -f ../craftux/build/maven-repo/dev/craftux/craftux-paper/1.0.2/craftux-paper-1.0.2.pom
          test -f ../mint/build/maven-repo/dev/jlo/mint/mint-api/1.0.0/mint-api-1.0.0.pom
          test -f "${{ runner.temp }}/m2/dev/jlo/preferences-api/0.1.0/preferences-api-0.1.0.pom"


      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply Postgres schema (for PG-backed unit tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          ./scripts/apply-postgres-schema.sh \
            "postgres://test:test@127.0.0.1:55432/modularjobs"

      - name: Check (compile + Error Prone + unit tests + static analysis)
        # quality.fail not set → Checkstyle/PMD/SpotBugs report-only
        run: ./gradlew check -Dmaven.repo.local=${{ runner.temp }}/m2 --console=plain --no-daemon

      - name: Shadow jar
        run: ./gradlew :paper:shadowJar -Dmaven.repo.local=${{ runner.temp }}/m2 --console=plain --no-daemon

      - name: Upload paper shadow jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-all
          path: paper/build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-reports
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/pmd/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
          if-no-files-found: ignore

  rest-api:
    name: rest-api (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/rest-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: modularjobs
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d modularjobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:55432/modularjobs
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: web/rest-api -> target

      - name: cargo test
        run: cargo test --all-targets

  session-editor:
    name: session-editor (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/session-editor

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/session-editor/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


  release:
    name: Publish immutable release assets
    if: github.ref == 'refs/tags/v1.2.0'
    needs: [java, rest-api, session-editor]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download CI shadow JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paper-all
          path: release-input

      - name: Require exact tag and unused release
        env:
          EXPECTED_TAG: v1.2.0
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::release already exists for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Package release assets
        run: |
          set -euo pipefail
          test -f release-input/paper-all.jar
          ./scripts/package-release-assets.sh \
            1.2.0 \
            release-input/paper-all.jar \
            paper/src/main/resources/sql/postgres.sql \
            dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/modularjobs-paper-1.2.0.jar \
            dist/modularjobs-postgres-1.2.0.sql \
            dist/SHA256SUMS \
            --verify-tag \
            --title "ModularJobs 1.2.0" \
            --generate-notes

      - name: Re-download and verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-verify
          gh release download "$GITHUB_REF_NAME" --dir release-verify
          (cd release-verify && sha256sum --check SHA256SUMS)
          {
            echo "### ModularJobs release"
            echo
            echo "- tag: \`$GITHUB_REF_NAME\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo
            echo '```'
            cat release-verify/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"