name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  api-build:
    name: API build + publish artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and build API
        run: ./gradlew --no-daemon :api:test :api:build

      - name: Upload API jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-jar
          path: api/build/libs/*.jar
          if-no-files-found: error

  java:
    name: Java (Error Prone + tests + quality + shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modularjobs
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Live MySQL for repository / schema tests (skipped when unreachable)
      MODULARJOBS_TEST_MYSQL_URL: jdbc:mysql://localhost:13306/modularjobs
      MODULARJOBS_TEST_MYSQL_USER: test
      MODULARJOBS_TEST_MYSQL_PASSWORD: test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Checkout craftux dependency (pinned release)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aincraft-org/craftux
          ref: 402bea8ce21847df632a10b00b563665db205de9
          path: craftux
          fetch-depth: 1

      - name: Link craftux local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/craftux" "$GITHUB_WORKSPACE/../craftux"

      - name: Set up Rust for craftux views
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Publish craftux local Maven artifacts
        working-directory: craftux
        run: |
          chmod +x gradlew
          ./gradlew \
            :api:publishMavenPublicationToLocalBuildRepository \
            :common:publishMavenPublicationToLocalBuildRepository \
            :paper:publishMavenPublicationToLocalBuildRepository \
            --console=plain --no-daemon
      - name: Require Mint read-only deploy key
        env:
          MINT_DEPLOY_KEY: ${{ secrets.MINT_DEPLOY_KEY }}
        run: |
          if [[ -z "$MINT_DEPLOY_KEY" ]]; then
            echo "::error::ModularJobs needs the repository-scoped read-only MINT_DEPLOY_KEY for aincraft-org/mint."
            exit 1
          fi

      - name: Checkout mint dependency (private, pinned source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aincraft-org/mint
          ref: 873fd3e359d3f3ac5b22fc84bc9aaae2a6adabdd
          path: mint
          fetch-depth: 1
          ssh-key: ${{ secrets.MINT_DEPLOY_KEY }}
          persist-credentials: false

      - name: Link mint local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/mint" "$GITHUB_WORKSPACE/../mint"

      - name: Publish mint API to local Maven repository
        working-directory: mint
        run: |
          chmod +x gradlew
          ./gradlew \
            :api:publishMavenPublicationToLocalBuildRepository \
            --console=plain --no-daemon
      - name: Checkout Preferences API dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mintychochip/Preferences
          ref: c78eac8c81104ba0890fc98d5f49090d90d0dee7
          path: preferences
          fetch-depth: 1

      - name: Publish Preferences API to isolated Maven local
        working-directory: preferences
        run: |
          chmod +x gradlew
          ./gradlew :api:publishToMavenLocal \
            -Dmaven.repo.local=${{ runner.temp }}/m2 \
            --console=plain --no-daemon

      - name: Checkout databag dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mintychochip/databag
          ref: e27fedd42489d66242460770e04745de3812afff
          path: databag
          fetch-depth: 1

      - name: Link databag local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/databag" "$GITHUB_WORKSPACE/../databag"

      - name: Publish databag local Maven artifacts
        working-directory: databag
        run: |
          chmod +x gradlew
          ./gradlew publishAllPublicationsToLocalBuildRepoRepository --console=plain --no-daemon

      - name: Checkout conditions dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aincraft-org/conditions
          ref: 052a8c6be7d908f2a6d9ed15d16081b74fd5ae8c
          path: conditions
          fetch-depth: 1

      - name: Link conditions local Maven repository
        run: ln -s "$GITHUB_WORKSPACE/conditions" "$GITHUB_WORKSPACE/../conditions"

      - name: Publish conditions local Maven artifacts
        working-directory: conditions
        run: |
          chmod +x gradlew
          ./gradlew publishAllPublicationsToLocalBuildRepoRepository --console=plain --no-daemon

      - name: Verify required local dependency artifacts
        run: |
          test -f ../craftux/build/maven-repo/dev/craftux/craftux-paper/1.0.2/craftux-paper-1.0.2.pom
          test -f ../databag/build/maven-repo/dev/databag/databag/0.0.0-SNAPSHOT/databag-0.0.0-SNAPSHOT.pom
          test -f ../conditions/build/maven-repo/dev/conditions/api/0.0.0-SNAPSHOT/api-0.0.0-SNAPSHOT.pom


      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply MySQL schema (for MySQL-backed unit tests)
        run: |
          ./scripts/apply-mysql-schema.sh \
            "mysql://test:test@127.0.0.1:13306/modularjobs"

      - name: Check (compile + Error Prone + unit tests + static analysis)
        # quality.fail not set → Checkstyle/PMD/SpotBugs report-only
        run: ./gradlew check -Dmaven.repo.local=${{ runner.temp }}/m2 --console=plain --no-daemon

      - name: Shadow jar
        run: ./gradlew :paper:shadowJar -Dmaven.repo.local=${{ runner.temp }}/m2 --console=plain --no-daemon

      - name: Upload paper shadow jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-all
          path: paper/build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-reports
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/pmd/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
          if-no-files-found: ignore

  rest-api:
    name: rest-api (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/rest-api

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: modularjobs
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:13306/modularjobs
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: web/rest-api -> target

      - name: cargo test
        run: cargo test --all-targets

  session-editor:
    name: session-editor (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/session-editor

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/session-editor/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
