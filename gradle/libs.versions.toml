[versions]
# Build plugins
# run-paper 3.x uses Fill API (v2 sunset); needed for Paper 26.x downloads
run-paper = "3.0.2"
# GradleUp shadow 9.x: ASM supports Java 25 class files (major 69)
shadow = "9.6.1"

# Static analysis (tool versions + Gradle plugins)
errorprone = "2.50.0"
errorprone-plugin = "5.1.0"
# Distinct keys so version catalog accessors don't nest under "spotbugs"
spotbugs-tool = "4.10.3"
spotbugs-gradle = "6.5.10"
pmd = "7.26.0"
checkstyle = "13.9.0"

# Core infrastructure
kryo = "5.6.2"
guava = "33.4.0-jre"
hikari = "5.0.1"
caffeine = "3.2.2"
exp4j = "0.4.8"
gson = "2.11.0"
configurate = "4.1.1"

# Minecraft ecosystem
# Paper 26.2 line (aligned with MockBukkit mockbukkit-v26.2)
paper = "26.2.build.65-beta"
mcmmo = "2.2.004"
lwc = "2.4.0"
bolt = "1.1.52"
placeholderapi = "2.11.6"
# Multi-surface UI (inventory/scoreboard/…); local build via ../craftux
craftux = "1.0.2"
# Mint durable ledger API (aincraft-org/mint; published to sibling ../mint/build/maven-repo)
mint-api = "1.0.0"
# DataBag primitive storage + condition graph (mintychochip/databag; sibling
# ../databag/build/maven-repo)
databag = "0.0.0-SNAPSHOT"

mockbukkit = "26.2.0-mj"
mysql = "9.4.0"

# Adventure (api pure surface — Keyed/Key/Component without Paper)
adventure = "4.21.0"

# Development tools
jetbrains-annotations = "24.1.0"

[libraries]
# Infrastructure
kryo = { module = "com.esotericsoftware:kryo", version.ref = "kryo" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
exp4j = { module = "net.objecthunter:exp4j", version.ref = "exp4j" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
configurate-core = { module = "org.spongepowered:configurate-core", version.ref = "configurate" }

# Adventure (standalone; paper still ships its own via paper-api)
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }

# Minecraft APIs
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
mcmmo = { module = "com.gmail.nossr50.mcMMO:mcMMO", version.ref = "mcmmo" }
lwc = { module = "com.griefcraft:lwc", version.ref = "lwc" }
bolt = { module = "org.popcraft:bolt-bukkit", version.ref = "bolt" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
craftux-api = { module = "dev.craftux:craftux-api", version.ref = "craftux" }
craftux-common = { module = "dev.craftux:craftux-common", version.ref = "craftux" }
craftux-paper = { module = "dev.craftux:craftux-paper", version.ref = "craftux" }
# Mint ledger API (compileOnly; Mint ships it at runtime)
mint-api = { module = "dev.jlo.mint:mint-api", version.ref = "mint-api" }
databag-common = { module = "dev.mintychochip.databag:databag-common", version.ref = "databag" }
databag-api = { module = "dev.mintychochip.databag:databag-api", version.ref = "databag" }
databag-paper = { module = "dev.mintychochip.databag:databag-paper", version.ref = "databag" }

mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }

# Development
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

# Static analysis
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

[bundles]
minecraft-api = ["paper-api", "mcmmo"]

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-gradle" }
